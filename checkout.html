<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | FLOWER Perfumes</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/style.css?v=2.0">
    <script src="js/ui-loader.js?v=1.2" defer></script>
    <style>
        body { background: #000; color: #fff; }
        .page-header { padding: 160px 0 60px; text-align: center; background: #050505; color: #fff; border-bottom: 1px solid #111; }
        .page-header h1 { color: var(--gold); font-family: var(--font-display); margin: 0; }
        
        .checkout-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 40px; margin-top: 40px; }
        .form-section { background: #0a0a0a; padding: 40px; border-radius: 12px; border: 1px solid #111; margin-bottom: 30px;}
        .form-section h2 { color: var(--gold); margin-bottom: 25px; font-family: var(--font-display); font-size: 1.8rem; border-bottom: 1px solid #222; padding-bottom: 15px; }
        
        .form-group { margin-bottom: 25px; }
        .form-row { display: flex; gap: 20px; }
        .form-row .form-group { flex: 1; }
        .form-group label { display: block; margin-bottom: 10px; font-weight: 500; color: #aaa; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }
        .form-group input, .form-group textarea { width: 100%; padding: 15px; background: #111; border: 1px solid #222; border-radius: 5px; color: #fff; font-family: inherit; transition: 0.3s; }
        .form-group input:focus { border-color: var(--gold); outline: none; background: #151515; }
        
        .order-summary { background: #050505; padding: 40px; border-radius: 12px; border: 1px solid var(--gold-deep); position: sticky; top: 100px; }
        .summary-title { color: var(--gold); margin-bottom: 25px; font-family: var(--font-display); }
        .summary-item { display: flex; justify-content: space-between; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #111; }
        .total-row { font-size: 1.5rem; font-weight: 700; display: flex; justify-content: space-between; margin-top: 25px; color: var(--gold); }
        
        .btn-confirm { background: var(--gold-gradient-rich); color: #000; font-weight: 800; border: none; border-radius: 5px; padding: 20px; width: 100%; font-size: 1.1rem; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: 0.4s; margin-top: 30px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-confirm:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(189, 142, 18, 0.3); }

        .success-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 9999; opacity: 0; pointer-events: none; transition: 0.5s; }
        .success-box { background: #0a0a0a; padding: 60px; border-radius: 16px; text-align: center; max-width: 500px; border: 1px solid var(--gold); }
        .success-overlay.active { opacity: 1; pointer-events: all; }
        
        @media(max-width: 900px) {
            .page-header { padding: 180px 0 44px; }
            .checkout-grid { grid-template-columns: 1fr; }
            .form-row { flex-direction: column; gap: 0; }
            .order-summary { position: static; }
        }
        @media(max-width: 768px) {
            .form-section,
            .order-summary {
                padding: 24px;
            }

            .form-section h2 {
                font-size: 1.45rem;
            }

            .btn-confirm {
                padding: 16px;
                font-size: 0.95rem;
                letter-spacing: 1px;
            }

            .success-box {
                width: calc(100% - 32px);
                padding: 34px 22px;
            }
        }
        @media(max-width: 480px) {
            .page-header { padding: 170px 0 36px; }
            .form-section,
            .order-summary {
                padding: 18px;
                border-radius: 10px;
            }

            .success-box h2 {
                font-size: 2rem !important;
            }
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>

    <section class="page-header">
        <div class="container">
            <h1>Complete Your Order</h1>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <div id="checkout-root">
                <div class="checkout-grid">
                    <!-- Shipping Form -->
                    <div class="checkout-forms">
                        <div class="form-section">
                            <h2>Delivery Details</h2>
                            <form id="checkout-form">
                                <div class="form-group">
                                    <label>Full Name</label>
                                    <input type="text" id="cust-name" required placeholder="Enter your full name">
                                </div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label>Email Address</label>
                                        <input type="email" id="cust-email" required placeholder="your@email.com">
                                    </div>
                                    <div class="form-group">
                                        <label>Phone Number (WhatsApp)</label>
                                        <input type="tel" id="cust-phone" required placeholder="+974 XXXX XXXX">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label>Delivery Address</label>
                                    <textarea id="cust-address" required placeholder="Building No, Street, Area / Zone" rows="3"></textarea>
                                </div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label>City / Area</label>
                                        <input type="text" id="cust-city" required placeholder="e.g. Doha, Lusail, Al Wakrah">
                                    </div>
                                    <div class="form-group">
                                        <label>Notes (Optional)</label>
                                        <input type="text" id="cust-notes" placeholder="Special delivery instructions">
                                    </div>
                                </div>
                                
                                <button type="submit" class="btn-confirm">
                                    <i class="fab fa-whatsapp"></i> Confirm via WhatsApp
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- Summary -->
                    <div class="order-summary" id="order-summary-box">
                        <!-- Rendered via JS -->
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Success Overlay -->
    <div class="success-overlay" id="success-overlay">
        <div class="success-box">
            <i class="fas fa-check-circle" style="color: var(--gold); font-size: 80px; margin-bottom: 30px;"></i>
            <h2 style="color: #fff; font-family: var(--font-display); font-size: 2.5rem; margin-bottom: 20px;">Order Sent!</h2>
            <p style="color: #aaa; margin-bottom: 40px; font-size: 1.1rem;">Thank you for choosing FLOWER Perfumes. We are now processing your order on WhatsApp.</p>
            <a href="index.html" class="btn-confirm" style="text-decoration: none;">Return to Gallery</a>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script type="module" src="js/data.js"></script>
    <script type="module" src="js/cart.js"></script>
    <script type="module">
        document.addEventListener('DOMContentLoaded', () => {
            renderCheckoutSummary();
            
            document.getElementById('checkout-form').addEventListener('submit', handleCheckout);
        });

        function renderCheckoutSummary() {
            const summaryBox = document.getElementById('order-summary-box');
            const cartItems = window.getCart ? window.getCart() : [];
            
            if (cartItems.length === 0) {
                document.getElementById('checkout-root').innerHTML = `
                    <div style="text-align:center; padding: 100px 0;">
                        <h2 style="color:var(--gold);">Your cart is empty</h2>
                        <a href="shop.html" class="btn-confirm" style="max-width:300px; margin: 30px auto; text-decoration:none;">Go to Shop</a>
                    </div>
                `;
                return;
            }

            let subtotal = 0;
            let itemsHtml = '<h2 class="summary-title">Order Summary</h2>';

            cartItems.forEach(item => {
                const total = parseFloat(item.price) * parseInt(item.quantity);
                subtotal += total;
                itemsHtml += `
                    <div class="summary-item">
                        <div style="display:flex; gap:15px; align-items:center;">
                            <img src="${item.image}" style="width:50px; height:50px; object-fit:cover; border-radius:5px; border:1px solid #222;">
                            <div>
                                <p style="margin:0; font-weight:600; font-size:0.9rem;">${item.title}</p>
                                <p style="margin:0; color:#888; font-size:0.8rem;">${item.quantity} x QR ${item.price}</p>
                            </div>
                        </div>
                        <div style="display:flex; align-items:center; gap:15px;">
                            <span style="font-weight:600;">QR ${total}</span>
                            <button onclick="window.removeCheckoutItem(${item.id})" style="background:none; border:none; color:#ff4444; cursor:pointer; font-size:1.3rem; padding:0;"><i class='bx bx-x'></i></button>
                        </div>
                    </div>
                `;
            });

            itemsHtml += `
                <div class="summary-item" style="border:none; margin-top:20px;">
                    <span style="color:#888;">Delivery</span>
                    <span style="color:var(--gold); font-weight:600;">FREE</span>
                </div>
                <div class="total-row">
                    <span>Total Bill</span>
                    <span>QR ${subtotal}</span>
                </div>
                <p style="color:#666; font-size:0.8rem; margin-top:20px; text-align:center;">Prices include VAT where applicable.</p>
            `;

            summaryBox.innerHTML = itemsHtml;
        }

        async function handleCheckout(e) {
            e.preventDefault();
            
            const name = document.getElementById('cust-name').value;
            const email = document.getElementById('cust-email').value;
            const phone = document.getElementById('cust-phone').value;
            const address = document.getElementById('cust-address').value;
            const city = document.getElementById('cust-city').value;
            const notes = document.getElementById('cust-notes').value;

            const cartItems = window.getCart ? window.getCart() : [];
            let total = 0;
            const itemsString = cartItems.map(item => {
                const itemTotal = parseFloat(item.price) * parseInt(item.quantity);
                total += itemTotal;
                return `• ${item.title} (${item.quantity}x) - QR ${itemTotal}`;
            }).join('%0A');

            const message = `? *NEW ORDER - FLOWER PERFUMES* ?%0A%0A` +
                            `?? *Customer:* ${name}%0A` +
                            `?? *Phone:* ${phone}%0A` +
                            `?? *Email:* ${email}%0A` +
                            `?? *Address:* ${address}, ${city}%0A` +
                            (notes ? `?? *Notes:* ${notes}%0A` : '') +
                            `%0A?? *Items Ordered:*%0A${itemsString}%0A%0A` +
                            `?? *Total Amount:* QR ${total}%0A%0A` +
                            `Please confirm my order and share the delivery timeline. Thank you!`;

            const whatsappUrl = `https://wa.me/97455382148?text=${message}`;

            // Show success overlay
            document.getElementById('success-overlay').classList.add('active');

            // Clear cart
            localStorage.removeItem('cartItems');
            if (window.updateCartBadge) window.updateCartBadge();

            // Redirect to WhatsApp after short delay
            setTimeout(() => {
                window.open(whatsappUrl, '_blank');
            }, 1500);
        }

        window.removeCheckoutItem = (id) => {
            if (window.removeFromCart) window.removeFromCart(id);
            renderCheckoutSummary();
        };
    </script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
