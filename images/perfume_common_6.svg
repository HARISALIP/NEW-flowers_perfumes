<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0c10" />
      <stop offset="50%" stop-color="#361c24" />
      <stop offset="100%" stop-color="#0f070a" />
    </linearGradient>
    
    <!-- Gold / Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3a3b5" />
      <stop offset="30%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f3a3b5" />
      <stop offset="100%" stop-color="#5a450c" />
    </linearGradient>
    
    <linearGradient id="metallicGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f3a3b5" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>

    <!-- Glass Refraction Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
      <stop offset="20%" stop-color="rgba(255,255,255,0.05)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.25)" />
      <stop offset="80%" stop-color="rgba(255,255,255,0.02)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.15)" />
    </linearGradient>

    <!-- Box Gradients -->
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#522934" />
      <stop offset="100%" stop-color="#30151d" />
    </linearGradient>
    <linearGradient id="boxSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.1)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.4)" />
    </linearGradient>

    <!-- Aura Glow Filter -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f3a3b5" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#f3a3b5" stop-opacity="0" />
    </radialGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
    
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="1200" fill="url(#bgGrad)" />
  
  <!-- Outer Ornate Frame -->
  <rect x="25" y="25" width="850" height="1150" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.3" rx="12" />
  <rect x="35" y="35" width="830" height="1130" fill="none" stroke="url(#accentGrad)" stroke-width="0.75" stroke-opacity="0.15" rx="8" />

  <!-- Corner Ornaments -->
  <!-- Top Left -->
  <path d="M25,60 Q60,60 60,25" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Top Right -->
  <path d="M875,60 Q840,60 840,25" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Bottom Left -->
  <path d="M25,1140 Q60,1140 60,1175" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Bottom Right -->
  <path d="M875,1140 Q840,1140 840,1175" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Centered Glow -->
  <circle cx="450" cy="550" r="320" fill="url(#glow)" filter="url(#blurFilter)" />
  
  <!-- Sparks / Light Particles -->
  <g opacity="0.3">
    <circle cx="250" cy="300" r="3" fill="#ffffff" />
    <circle cx="650" cy="400" r="2" fill="#f3a3b5" />
    <circle cx="300" cy="700" r="4" fill="#f3a3b5" opacity="0.5" />
    <circle cx="600" cy="800" r="3" fill="#ffffff" />
    <circle cx="450" cy="200" r="2" fill="#f3a3b5" />
    <circle cx="200" cy="550" r="3" fill="#f3a3b5" />
    <circle cx="700" cy="650" r="4" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Bottle Base Shadow -->
  <ellipse cx="450" cy="890" rx="160" ry="20" fill="#000000" opacity="0.8" filter="url(#blurFilter)" />

  <g filter="url(#shadowFilter)">
    <!-- Golden Liquid inside (Base Fill) -->
    <rect x="300" y="440" width="300" height="400" rx="30" fill="url(#boxFront)" opacity="0.9" />

    <!-- Glass Bottle Body -->
    <rect x="300" y="440" width="300" height="400" rx="30" fill="url(#glassGrad)" stroke="url(#accentGrad)" stroke-width="2" />
    
    <!-- Internal Straw -->
    <line x1="450" y1="390" x2="450" y2="810" stroke="url(#accentGrad)" stroke-width="2.5" opacity="0.6" />
    
    <!-- Bottle Shoulders Bevel -->
    <path d="M300,470 L300,440 L600,440 L600,470 Z" fill="rgba(255,255,255,0.08)" />
    
    <!-- Bottle Neck -->
    <rect x="410" y="375" width="80" height="65" rx="4" fill="url(#metallicGrad)" stroke="url(#accentGrad)" stroke-width="1" />
    <rect x="400" y="420" width="100" height="20" rx="2" fill="url(#accentGrad)" />
    
    <!-- Premium Cap -->
    <!-- Inner Base -->
    <rect x="380" y="270" width="140" height="110" rx="10" fill="url(#metallicGrad)" stroke="url(#accentGrad)" stroke-width="1.5" />
    <!-- Cap Crown Decoration -->
    <ellipse cx="450" cy="270" rx="55" ry="12" fill="url(#accentGrad)" />
    <circle cx="450" cy="250" r="16" fill="url(#accentGrad)" />
    <circle cx="450" cy="250" r="8" fill="#ffffff" opacity="0.5" />

    <!-- Label on Bottle -->
    <rect x="340" y="550" width="220" height="180" rx="6" fill="#111111" stroke="url(#accentGrad)" stroke-width="1.5" />
    <rect x="348" y="558" width="204" height="164" rx="3" fill="none" stroke="url(#accentGrad)" stroke-width="0.5" stroke-opacity="0.5" />
    
    <!-- Emblem Gold Badge on Label -->
    <circle cx="450" cy="640" r="48" fill="url(#accentGrad)" />
    
    <!-- Flower Icon inside Label Badge -->
    <circle cx="450" cy="640" r="10" fill="#111111" />
    <circle cx="450" cy="623" r="8" fill="#111111" />
    <circle cx="467" cy="634" r="8" fill="#111111" />
    <circle cx="460" cy="654" r="8" fill="#111111" />
    <circle cx="440" cy="654" r="8" fill="#111111" />
    <circle cx="433" cy="634" r="8" fill="#111111" />
    
    <!-- Core Dots -->
    <circle cx="450" cy="640" r="4" fill="url(#accentGrad)" />
    <circle cx="450" cy="623" r="2.5" fill="url(#accentGrad)" />
    <circle cx="467" cy="634" r="2.5" fill="url(#accentGrad)" />
    <circle cx="460" cy="654" r="2.5" fill="url(#accentGrad)" />
    <circle cx="440" cy="654" r="2.5" fill="url(#accentGrad)" />
    <circle cx="433" cy="634" r="2.5" fill="url(#accentGrad)" />

    <!-- Highlight Reflection Lines (Gives real shiny glass feel) -->
    <path d="M315,470 L315,810" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.25" />
    <path d="M328,485 L328,620" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.15" />
    <path d="M585,470 L585,810" stroke="#000000" stroke-width="5" stroke-linecap="round" opacity="0.3" />
  </g>

</svg>
