<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080214" />
      <stop offset="50%" stop-color="#1d083b" />
      <stop offset="100%" stop-color="#04010a" />
    </linearGradient>
    
    <!-- Gold / Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f48fb1" />
      <stop offset="30%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f48fb1" />
      <stop offset="100%" stop-color="#5a450c" />
    </linearGradient>
    
    <linearGradient id="metallicGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f48fb1" />
      <stop offset="50%" stop-color="#f48fb1" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>

    <!-- Glass Refraction Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
      <stop offset="20%" stop-color="rgba(255,255,255,0.05)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.25)" />
      <stop offset="80%" stop-color="rgba(255,255,255,0.02)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.15)" />
    </linearGradient>

    <!-- Box Gradients -->
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#311b92" />
      <stop offset="100%" stop-color="#1a0033" />
    </linearGradient>
    <linearGradient id="boxSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.1)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.4)" />
    </linearGradient>

    <!-- Aura Glow Filter -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f48fb1" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#f48fb1" stop-opacity="0" />
    </radialGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
    
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="1200" fill="url(#bgGrad)" />
  
  <!-- Outer Ornate Frame -->
  <rect x="25" y="25" width="850" height="1150" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.3" rx="12" />
  <rect x="35" y="35" width="830" height="1130" fill="none" stroke="url(#accentGrad)" stroke-width="0.75" stroke-opacity="0.15" rx="8" />

  <!-- Corner Ornaments -->
  <!-- Top Left -->
  <path d="M25,60 Q60,60 60,25" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Top Right -->
  <path d="M875,60 Q840,60 840,25" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Bottom Left -->
  <path d="M25,1140 Q60,1140 60,1175" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Bottom Right -->
  <path d="M875,1140 Q840,1140 840,1175" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Centered Glow -->
  <circle cx="450" cy="550" r="320" fill="url(#glow)" filter="url(#blurFilter)" />
  
  <!-- Sparks / Light Particles -->
  <g opacity="0.3">
    <circle cx="250" cy="300" r="3" fill="#ffffff" />
    <circle cx="650" cy="400" r="2" fill="#f48fb1" />
    <circle cx="300" cy="700" r="4" fill="#f48fb1" opacity="0.5" />
    <circle cx="600" cy="800" r="3" fill="#ffffff" />
    <circle cx="450" cy="200" r="2" fill="#f48fb1" />
    <circle cx="200" cy="550" r="3" fill="#f48fb1" />
    <circle cx="700" cy="650" r="4" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Box Shadow -->
  <ellipse cx="450" cy="880" rx="200" ry="25" fill="#000000" opacity="0.75" filter="url(#blurFilter)" />

  <g filter="url(#shadowFilter)">
    <!-- Box Side Bevel (3D effect) -->
    <path d="M250,300 L270,280 L570,280 L550,300 Z" fill="url(#boxSide)" />
    <path d="M550,300 L570,280 L570,830 L550,850 Z" fill="url(#boxSide)" />
    
    <!-- Box Front Face -->
    <rect x="250" y="300" width="300" height="550" rx="8" fill="url(#boxFront)" stroke="url(#accentGrad)" stroke-width="1.5" />
    
    <!-- Gold Ribbon / Wrapping Strip -->
    <rect x="385" y="300" width="30" height="550" fill="url(#accentGrad)" opacity="0.85" />
    <rect x="250" y="550" width="300" height="40" fill="url(#accentGrad)" opacity="0.85" />
    
    <!-- Central Metallic Gold Seal / Emblem -->
    <circle cx="400" cy="570" r="70" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="1" />
    <circle cx="400" cy="570" r="62" fill="none" stroke="#000000" stroke-width="0.5" stroke-dasharray="3,3" />
    
    <!-- Flower Icon in the Seal -->
    <!-- Center Circle -->
    <circle cx="400" cy="570" r="14" fill="#111111" />
    <!-- 5 Petals -->
    <circle cx="400" cy="546" r="12" fill="#111111" />
    <circle cx="423" cy="562" r="12" fill="#111111" />
    <circle cx="414" cy="589" r="12" fill="#111111" />
    <circle cx="386" cy="589" r="12" fill="#111111" />
    <circle cx="377" cy="562" r="12" fill="#111111" />
    
    <!-- Inner Flower Dots -->
    <circle cx="400" cy="570" r="6" fill="url(#accentGrad)" />
    <circle cx="400" cy="546" r="4" fill="url(#accentGrad)" />
    <circle cx="423" cy="562" r="4" fill="url(#accentGrad)" />
    <circle cx="414" cy="589" r="4" fill="url(#accentGrad)" />
    <circle cx="386" cy="589" r="4" fill="url(#accentGrad)" />
    <circle cx="377" cy="562" r="4" fill="url(#accentGrad)" />
    
    <!-- Embossed Border Line inside Box -->
    <rect x="265" y="315" width="270" height="520" rx="4" fill="none" stroke="url(#accentGrad)" stroke-width="1" stroke-opacity="0.3" />
  </g>

</svg>
