<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | FLOWER Perfumes</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/ui-loader.js" defer></script>
    <style>
        .contact-page { padding-top: 150px; background: var(--bg-primary); min-height: 100vh; }
        .contact-grid { display: grid; grid-template-columns: 1fr; gap: 60px; max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        @media (min-width: 768px) { .contact-grid { grid-template-columns: 1fr 1fr; } }
        
        .contact-info-card { background: var(--bg-card); padding: 40px; border-radius: 15px; border: 1px solid rgba(212,175,55,0.1); }
        .info-item { display: flex; gap: 20px; margin-bottom: 30px; }
        .info-item i { font-size: 1.8rem; color: var(--gold); }
        .info-item h4 { margin: 0 0 5px 0; color: var(--text-primary); font-family: var(--font-display); font-size: 1.2rem; }
        .info-item p { margin: 0; color: var(--text-muted); font-size: 1rem; line-height: 1.6; }
        .wa-list { list-style: none; padding: 0; margin-top: 10px; }
        .wa-list li { margin-bottom: 15px; }
        .wa-list a { color: var(--gold); text-decoration: none; display: flex; align-items: center; gap: 10px; font-weight: 600; }
        @media (max-width: 768px) {
            .contact-page { padding-top: 125px; }
            .contact-grid { gap: 28px; padding: 0 16px; }
            .contact-info-card,
            .contact-form-card { padding: 24px !important; }
        }
        @media (max-width: 480px) {
            .contact-page { padding-top: 112px; }
            .info-item { gap: 14px; }
        }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <div class="contact-page">
        <div class="container text-center" style="margin-bottom:60px;">
            <span class="section-label">— Get in Touch</span>
            <h1 class="section-title">Visit Our Boutique</h1>
            <div class="gold-divider center"></div>
        </div>

        <div class="contact-grid">
            <div class="contact-info-card">
                <div class="info-item">
                    <i class='bx bx-map-pin'></i>
                    <div>
                        <h4>Our Location</h4>
                        <p>Shop No. 523,<br>Souq Waqif, Doha - Qatar</p>
                    </div>
                </div>
                <div class="info-item">
                    <i class='bx bxl-whatsapp'></i>
                    <div>
                        <h4>WhatsApp Orders</h4>
                        <ul class="wa-list">
                            <li><a href="https://wa.me/97455382148"><i class='bx bxl-whatsapp'></i> Ibrahim Khalil: +974 5538 2148</a></li>
                            <li><a href="https://wa.me/97455640394"><i class='bx bxl-whatsapp'></i> Khaliluddin: +974 5564 0394</a></li>
                        </ul>
                    </div>
                </div>
                <div class="info-item">
                    <i class='bx bx-time-five'></i>
                    <div>
                        <h4>Opening Hours</h4>
                        <p>Daily: 9:00 AM - 10:00 PM<br>Friday: 4:00 PM - 11:00 PM</p>
                    </div>
                </div>
            </div>

            <div class="contact-form-card" style="background: #0a0a0a; padding: 40px; border-radius: 15px; border: 1px solid #222;">
                <h3 style="color: var(--gold); font-family: var(--font-display); margin-top:0; font-size: 1.8rem; margin-bottom: 20px;">Send an Inquiry</h3>
                <form id="wa-contact-form" onsubmit="sendWhatsAppMsg(event)">
                    <div style="margin-bottom: 15px;">
                        <input type="text" id="wa-name" placeholder="Your Name *" required style="width: 100%; padding: 12px; background: #111; border: 1px solid #333; color: #fff; border-radius: 4px; outline: none; transition: 0.3s;" onfocus="this.style.borderColor='var(--gold)'" onblur="this.style.borderColor='#333'">
                    </div>
                    <div style="margin-bottom: 15px;">
                        <input type="tel" id="wa-phone" placeholder="Phone Number *" required style="width: 100%; padding: 12px; background: #111; border: 1px solid #333; color: #fff; border-radius: 4px; outline: none; transition: 0.3s;" onfocus="this.style.borderColor='var(--gold)'" onblur="this.style.borderColor='#333'">
                    </div>
                    <div style="margin-bottom: 15px;">
                        <input type="email" id="wa-email" placeholder="Email Address" style="width: 100%; padding: 12px; background: #111; border: 1px solid #333; color: #fff; border-radius: 4px; outline: none; transition: 0.3s;" onfocus="this.style.borderColor='var(--gold)'" onblur="this.style.borderColor='#333'">
                    </div>
                    <div style="margin-bottom: 15px;">
                        <select id="wa-perfume" style="width: 100%; padding: 12px; background: #111; border: 1px solid #333; color: #fff; border-radius: 4px; outline: none; cursor: pointer; transition: 0.3s;" onfocus="this.style.borderColor='var(--gold)'" onblur="this.style.borderColor='#333'">
                            <option value="General Inquiry">General Inquiry</option>
                            <option value="MIDNIGHT OUD">Inquiry: MIDNIGHT OUD</option>
                            <option value="ROSE ELEGANCE">Inquiry: ROSE ELEGANCE</option>
                            <option value="MILKY WAY">Inquiry: MILKY WAY</option>
                            <option value="HAUTE TOBACCO">Inquiry: HAUTE TOBACCO</option>
                            <option value="Wholesale">Wholesale / Bulk Order</option>
                        </select>
                    </div>
                    <div style="margin-bottom: 20px;">
                        <textarea id="wa-message" placeholder="Your Message *" required rows="4" style="width: 100%; padding: 12px; background: #111; border: 1px solid #333; color: #fff; border-radius: 4px; outline: none; resize: none; transition: 0.3s;" onfocus="this.style.borderColor='var(--gold)'" onblur="this.style.borderColor='#333'"></textarea>
                    </div>
                    <button type="submit" class="btn btn-gold" style="width: 100%; padding: 15px; font-weight: 700; border: none; cursor: pointer; border-radius: 4px; display: flex; justify-content: center; align-items: center; gap: 10px;">
                        <i class='bx bxl-whatsapp' style="font-size: 1.5rem;"></i> Send via WhatsApp
                    </button>
                </form>
            </div>
        </div>

        <div class="container" style="margin-top: 60px; margin-bottom: 60px;">
            <div class="contact-map" style="width: 100%; border-radius: 15px; overflow: hidden; border: 1px solid #333;">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1803.71458!2d51.5298813!3d25.28905!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3e45c5339d67711d%3A0x7d6f5f3e97034cf5!2sSouq%20Waqif!5e0!3m2!1sen!2sqa!4v1713600000000!5m2!1sen!2sqa" width="100%" height="450" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script type="module" src="js/cart.js"></script>
    <script src="js/script.js"></script>
    <script>
        function sendWhatsAppMsg(e) {
            e.preventDefault();
            const name = document.getElementById('wa-name').value;
            const phone = document.getElementById('wa-phone').value;
            const email = document.getElementById('wa-email').value;
            const perfume = document.getElementById('wa-perfume').value;
            const msg = document.getElementById('wa-message').value;

            const text = `✨ *NEW INQUIRY - FLOWER PERFUMES* ✨%0A%0A` +
                         `👤 *Name:* ${name}%0A` +
                         `📞 *Phone:* ${phone}%0A` +
                         (email ? `📧 *Email:* ${email}%0A` : '') +
                         `🏷️ *Topic:* ${perfume}%0A%0A` +
                         `💬 *Message:*%0A${msg}`;

            window.open(`https://wa.me/97455382148?text=${text}`, '_blank');
        }
    </script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
